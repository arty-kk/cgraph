version: "3.9"

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/stubgraph.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  migrations:
    build:
      context: ./backend
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      STUBGRAPH_DATABASE_URL: ${STUBGRAPH_DATABASE_URL}
    depends_on:
      - db
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      STUBGRAPH_DB_DIR: /data
      STUBGRAPH_DATABASE_URL: ${STUBGRAPH_DATABASE_URL}
      STUBGRAPH_STORAGE_BACKEND: ${STUBGRAPH_STORAGE_BACKEND:-local}
      STUBGRAPH_S3_BUCKET: ${STUBGRAPH_S3_BUCKET:-}
      STUBGRAPH_S3_REGION: ${STUBGRAPH_S3_REGION:-}
      STUBGRAPH_S3_ENDPOINT_URL: ${STUBGRAPH_S3_ENDPOINT_URL:-}
      STUBGRAPH_S3_ACCESS_KEY_ID: ${STUBGRAPH_S3_ACCESS_KEY_ID:-}
      STUBGRAPH_S3_SECRET_ACCESS_KEY: ${STUBGRAPH_S3_SECRET_ACCESS_KEY:-}
      STUBGRAPH_S3_PREFIX: ${STUBGRAPH_S3_PREFIX:-}
      STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS: ${STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS:-3600}
      STUBGRAPH_PATCH_RETENTION_DAYS: ${STUBGRAPH_PATCH_RETENTION_DAYS:-7}
      STUBGRAPH_TASK_QUEUE_DEFAULT: ${STUBGRAPH_TASK_QUEUE_DEFAULT:-medium}
      STUBGRAPH_AUTH_ENABLED: ${STUBGRAPH_AUTH_ENABLED:-true}
      STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP: ${STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP:-false}
      STUBGRAPH_AUTH_PASSWORD_PEPPER: ${STUBGRAPH_AUTH_PASSWORD_PEPPER:-stubgraph}
      STUBGRAPH_AUTH_SESSION_TTL_HOURS: ${STUBGRAPH_AUTH_SESSION_TTL_HOURS:-24}
      STUBGRAPH_AUTH_API_KEY_TTL_DAYS: ${STUBGRAPH_AUTH_API_KEY_TTL_DAYS:-}
      STUBGRAPH_REDIS_URL: ${STUBGRAPH_REDIS_URL}
      STUBGRAPH_CACHE_ENABLED: ${STUBGRAPH_CACHE_ENABLED:-true}
      STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS: ${STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS:-300}
      STUBGRAPH_RATE_LIMIT_ENABLED: ${STUBGRAPH_RATE_LIMIT_ENABLED:-true}
      STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT: ${STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT:-}
      STUBGRAPH_TRUSTED_PROXY_CIDRS: ${STUBGRAPH_TRUSTED_PROXY_CIDRS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STUBGRAPH_CORS_ALLOW_ORIGINS: ${STUBGRAPH_CORS_ALLOW_ORIGINS}
    volumes:
      - stubgraph_data:/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker_light:
    build:
      context: ./backend
    command: ["arq", "app.arq_worker.WorkerSettings"]
    environment:
      STUBGRAPH_ARQ_QUEUE: light
      STUBGRAPH_ARQ_ENABLE_CRON: "true"
      STUBGRAPH_DB_DIR: /data
      STUBGRAPH_DATABASE_URL: ${STUBGRAPH_DATABASE_URL}
      STUBGRAPH_STORAGE_BACKEND: ${STUBGRAPH_STORAGE_BACKEND:-local}
      STUBGRAPH_S3_BUCKET: ${STUBGRAPH_S3_BUCKET:-}
      STUBGRAPH_S3_REGION: ${STUBGRAPH_S3_REGION:-}
      STUBGRAPH_S3_ENDPOINT_URL: ${STUBGRAPH_S3_ENDPOINT_URL:-}
      STUBGRAPH_S3_ACCESS_KEY_ID: ${STUBGRAPH_S3_ACCESS_KEY_ID:-}
      STUBGRAPH_S3_SECRET_ACCESS_KEY: ${STUBGRAPH_S3_SECRET_ACCESS_KEY:-}
      STUBGRAPH_S3_PREFIX: ${STUBGRAPH_S3_PREFIX:-}
      STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS: ${STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS:-3600}
      STUBGRAPH_PATCH_RETENTION_DAYS: ${STUBGRAPH_PATCH_RETENTION_DAYS:-7}
      STUBGRAPH_TASK_QUEUE_DEFAULT: ${STUBGRAPH_TASK_QUEUE_DEFAULT:-medium}
      STUBGRAPH_AUTH_ENABLED: ${STUBGRAPH_AUTH_ENABLED:-true}
      STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP: ${STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP:-false}
      STUBGRAPH_AUTH_PASSWORD_PEPPER: ${STUBGRAPH_AUTH_PASSWORD_PEPPER:-stubgraph}
      STUBGRAPH_AUTH_SESSION_TTL_HOURS: ${STUBGRAPH_AUTH_SESSION_TTL_HOURS:-24}
      STUBGRAPH_AUTH_API_KEY_TTL_DAYS: ${STUBGRAPH_AUTH_API_KEY_TTL_DAYS:-}
      STUBGRAPH_REDIS_URL: ${STUBGRAPH_REDIS_URL}
      STUBGRAPH_CACHE_ENABLED: ${STUBGRAPH_CACHE_ENABLED:-true}
      STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS: ${STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS:-300}
      STUBGRAPH_RATE_LIMIT_ENABLED: ${STUBGRAPH_RATE_LIMIT_ENABLED:-true}
      STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT: ${STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - stubgraph_data:/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker_medium:
    build:
      context: ./backend
    command: ["arq", "app.arq_worker.WorkerSettings"]
    environment:
      STUBGRAPH_ARQ_QUEUE: medium
      STUBGRAPH_ARQ_ENABLE_CRON: "false"
      STUBGRAPH_DB_DIR: /data
      STUBGRAPH_DATABASE_URL: ${STUBGRAPH_DATABASE_URL}
      STUBGRAPH_STORAGE_BACKEND: ${STUBGRAPH_STORAGE_BACKEND:-local}
      STUBGRAPH_S3_BUCKET: ${STUBGRAPH_S3_BUCKET:-}
      STUBGRAPH_S3_REGION: ${STUBGRAPH_S3_REGION:-}
      STUBGRAPH_S3_ENDPOINT_URL: ${STUBGRAPH_S3_ENDPOINT_URL:-}
      STUBGRAPH_S3_ACCESS_KEY_ID: ${STUBGRAPH_S3_ACCESS_KEY_ID:-}
      STUBGRAPH_S3_SECRET_ACCESS_KEY: ${STUBGRAPH_S3_SECRET_ACCESS_KEY:-}
      STUBGRAPH_S3_PREFIX: ${STUBGRAPH_S3_PREFIX:-}
      STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS: ${STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS:-3600}
      STUBGRAPH_PATCH_RETENTION_DAYS: ${STUBGRAPH_PATCH_RETENTION_DAYS:-7}
      STUBGRAPH_TASK_QUEUE_DEFAULT: ${STUBGRAPH_TASK_QUEUE_DEFAULT:-medium}
      STUBGRAPH_AUTH_ENABLED: ${STUBGRAPH_AUTH_ENABLED:-true}
      STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP: ${STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP:-false}
      STUBGRAPH_AUTH_PASSWORD_PEPPER: ${STUBGRAPH_AUTH_PASSWORD_PEPPER:-stubgraph}
      STUBGRAPH_AUTH_SESSION_TTL_HOURS: ${STUBGRAPH_AUTH_SESSION_TTL_HOURS:-24}
      STUBGRAPH_AUTH_API_KEY_TTL_DAYS: ${STUBGRAPH_AUTH_API_KEY_TTL_DAYS:-}
      STUBGRAPH_REDIS_URL: ${STUBGRAPH_REDIS_URL}
      STUBGRAPH_CACHE_ENABLED: ${STUBGRAPH_CACHE_ENABLED:-true}
      STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS: ${STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS:-300}
      STUBGRAPH_RATE_LIMIT_ENABLED: ${STUBGRAPH_RATE_LIMIT_ENABLED:-true}
      STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT: ${STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - stubgraph_data:/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker_heavy:
    build:
      context: ./backend
    command: ["arq", "app.arq_worker.WorkerSettings"]
    environment:
      STUBGRAPH_ARQ_QUEUE: heavy
      STUBGRAPH_ARQ_ENABLE_CRON: "false"
      STUBGRAPH_DB_DIR: /data
      STUBGRAPH_DATABASE_URL: ${STUBGRAPH_DATABASE_URL}
      STUBGRAPH_STORAGE_BACKEND: ${STUBGRAPH_STORAGE_BACKEND:-local}
      STUBGRAPH_S3_BUCKET: ${STUBGRAPH_S3_BUCKET:-}
      STUBGRAPH_S3_REGION: ${STUBGRAPH_S3_REGION:-}
      STUBGRAPH_S3_ENDPOINT_URL: ${STUBGRAPH_S3_ENDPOINT_URL:-}
      STUBGRAPH_S3_ACCESS_KEY_ID: ${STUBGRAPH_S3_ACCESS_KEY_ID:-}
      STUBGRAPH_S3_SECRET_ACCESS_KEY: ${STUBGRAPH_S3_SECRET_ACCESS_KEY:-}
      STUBGRAPH_S3_PREFIX: ${STUBGRAPH_S3_PREFIX:-}
      STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS: ${STUBGRAPH_S3_SIGNED_URL_TTL_SECONDS:-3600}
      STUBGRAPH_PATCH_RETENTION_DAYS: ${STUBGRAPH_PATCH_RETENTION_DAYS:-7}
      STUBGRAPH_TASK_QUEUE_DEFAULT: ${STUBGRAPH_TASK_QUEUE_DEFAULT:-medium}
      STUBGRAPH_AUTH_ENABLED: ${STUBGRAPH_AUTH_ENABLED:-true}
      STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP: ${STUBGRAPH_AUTH_ALLOW_PUBLIC_SIGNUP:-false}
      STUBGRAPH_AUTH_PASSWORD_PEPPER: ${STUBGRAPH_AUTH_PASSWORD_PEPPER:-stubgraph}
      STUBGRAPH_AUTH_SESSION_TTL_HOURS: ${STUBGRAPH_AUTH_SESSION_TTL_HOURS:-24}
      STUBGRAPH_AUTH_API_KEY_TTL_DAYS: ${STUBGRAPH_AUTH_API_KEY_TTL_DAYS:-}
      STUBGRAPH_REDIS_URL: ${STUBGRAPH_REDIS_URL}
      STUBGRAPH_CACHE_ENABLED: ${STUBGRAPH_CACHE_ENABLED:-true}
      STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS: ${STUBGRAPH_CACHE_DEFAULT_TTL_SECONDS:-300}
      STUBGRAPH_RATE_LIMIT_ENABLED: ${STUBGRAPH_RATE_LIMIT_ENABLED:-true}
      STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${STUBGRAPH_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT: ${STUBGRAPH_TASK_QUEUE_INFLIGHT_HEAVY_LIMIT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - stubgraph_data:/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - stubgraph_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - stubgraph_redis:/data
    restart: unless-stopped

volumes:
  stubgraph_data:
  stubgraph_pgdata:
  stubgraph_redis:
